<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Grocery List</title>
<link rel="stylesheet" href="style.css">

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2f9e44">

<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Grocery List">
</head>
<body>
  <main class="app">
    <h1>Grocery List</h1>

    <form id="add-form" class="add-form">
      <input type="text" id="item-input" placeholder="Add an item…" autocomplete="off" required>
      <button type="submit">Add</button>
    </form>

    <ul id="list" class="list"></ul>

    <p id="empty-message" class="empty-message">Your list is empty. Add something above!</p>
  </main>

  <canvas id="fireworks" class="fireworks" hidden></canvas>

  <script src="script.js"></script>
</body>
</html>
